version: "3.9"

services:
  # ─── Frontend Next.js ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_ORDERS_API_URL=http://localhost:8001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - orders-service

  # ─── Microservicio: Órdenes & Pagos ──────────────────────────────────────────
  orders-service:
    build:
      context: ./services/orders-service
    ports:
      - "8001:8001"
    environment:
      - ENV=development
    volumes:
      - ./services/orders-service:/service
    restart: unless-stopped
